<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فضائل بنجامين فرانكلين الثلاث عشرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a16;
    --paper:#e9dfc6;
    --paper-dim:#d8caa4;
    --brass:#a9803f;
    --brass-bright:#c99c4e;
    --verdigris:#5c7b6b;
    --line:#4a4436;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:'Cairo',sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 85% 12%, rgba(169,128,63,0.10), transparent 45%),
      radial-gradient(circle at 12% 90%, rgba(92,123,107,0.10), transparent 40%),
      var(--ink);
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 36px;
    border-bottom:1px solid rgba(233,223,198,0.15);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand .en{
    font-family:'Cairo',sans-serif;
    font-size:11px;
    letter-spacing:2px;
    color:var(--brass-bright);
    text-transform:uppercase;
  }
  .brand .ar{
    font-family:'Amiri',serif;
    font-size:19px;
    color:var(--paper);
  }

  .tashkeel-toggle{
    display:flex;
    align-items:center;
    gap:12px;
    background:transparent;
    border:1px solid var(--brass);
    color:var(--paper);
    font-family:'Cairo',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:10px 18px;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.25s ease, color 0.25s ease;
  }
  .tashkeel-toggle:hover{
    background:var(--brass);
    color:var(--ink);
  }
  .tashkeel-toggle .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--verdigris);
    transition:background 0.2s ease;
    flex-shrink:0;
  }
  .tashkeel-toggle.off .dot{ background:#8a4b3f; }

  /* main content */
  .main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:20px 60px;
    min-height:0;
  }

  .frame{
    width:100%;
    max-width:900px;
    height:100%;
    max-height:620px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    overflow-y:auto;
    padding:6px 4px;
  }
  .frame::-webkit-scrollbar{ width:0; height:0; }

  .num-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
    flex-shrink:0;
  }
  .num-row .line{
    width:52px;height:1px;background:var(--brass);
  }
  .num{
    font-family:'Amiri',serif;
    font-size:16px;
    color:var(--brass-bright);
    letter-spacing:1px;
  }

  .virtue-name{
    font-family:'Amiri',serif;
    font-weight:700;
    font-size:clamp(36px,6vw,64px);
    line-height:1.25;
    color:var(--paper);
    margin:0 0 22px 0;
    transition:opacity 0.15s ease;
    flex-shrink:0;
  }

  .virtue-motto{
    font-family:'Amiri',serif;
    font-size:clamp(19px,2.3vw,25px);
    line-height:2;
    color:var(--paper-dim);
    max-width:680px;
    margin:0;
    transition:opacity 0.15s ease;
    flex-shrink:0;
  }

  .virtue-motto::before,
  .virtue-motto::after{
    content:"❧";
    color:var(--verdigris);
    font-size:16px;
    display:inline-block;
    margin:0 10px;
    vertical-align:middle;
  }

  /* translations panel */
  .translations{
    margin-top:30px;
    padding-top:26px;
    border-top:1px solid rgba(233,223,198,0.15);
    width:100%;
    max-width:680px;
    display:flex;
    flex-direction:column;
    gap:18px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease, padding-top 0.35s ease;
    flex-shrink:0;
  }
  .translations.open{
    max-height:400px;
    opacity:1;
  }
  .translations.hidden-state{
    margin-top:0;
    padding-top:0;
    border-top-color:transparent;
  }

  .tr-block{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .tr-lang{
    font-family:'Cairo',sans-serif;
    font-size:11px;
    letter-spacing:2px;
    color:var(--verdigris);
    text-transform:uppercase;
  }
  .tr-en{
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--paper);
    direction:ltr;
  }
  .tr-en-motto{
    font-family:'Cairo',sans-serif;
    font-weight:300;
    font-size:14.5px;
    line-height:1.7;
    color:var(--paper-dim);
    direction:ltr;
  }
  .tr-ku{
    font-family:'Noto Sans Arabic',sans-serif;
    font-weight:600;
    font-size:17px;
    color:var(--paper);
  }
  .tr-ku-motto{
    font-family:'Noto Sans Arabic',sans-serif;
    font-weight:400;
    font-size:14.5px;
    line-height:1.9;
    color:var(--paper-dim);
  }

  /* bottom nav */
  .bottombar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 36px 30px 36px;
    flex-shrink:0;
  }
  .nav-btn{
    background:transparent;
    border:1px solid rgba(233,223,198,0.3);
    color:var(--paper);
    width:46px;height:46px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:18px;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .nav-btn:hover{ border-color:var(--brass-bright); background:rgba(169,128,63,0.12); }
  .nav-btn:disabled{ opacity:0.25; cursor:default; }
  .nav-btn:disabled:hover{ background:transparent; border-color:rgba(233,223,198,0.3); }

  .progress-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    max-width:520px;
    margin:0 30px;
  }
  .tick{
    flex:1;
    height:2px;
    background:rgba(233,223,198,0.2);
    border-radius:2px;
    cursor:pointer;
    position:relative;
    transition:background 0.2s ease;
  }
  .tick.active{ background:var(--brass-bright); }
  .tick:hover{ background:var(--brass); }

  .counter{
    font-family:'Cairo',sans-serif;
    font-size:13px;
    color:var(--paper-dim);
    letter-spacing:1px;
    min-width:64px;
    text-align:center;
  }

  @media (max-width:640px){
    .topbar{padding:16px 18px;}
    .brand .ar{font-size:15px;}
    .tashkeel-toggle{padding:8px 12px;font-size:12px;gap:8px;}
    .main{padding:10px 20px;}
    .bottombar{padding:16px 18px 22px 18px;}
    .progress-wrap{margin:0 14px;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="topbar">
    <div class="brand">
      <span class="en">Benjamin Franklin</span>
      <span class="ar">الفضائل الثَّلاث عشرة</span>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end;">
      <button class="tashkeel-toggle" id="tashkeelBtn">
        <span class="dot"></span>
        <span id="tashkeelLabel">إخفاء التَّشكيل</span>
      </button>
      <button class="tashkeel-toggle off" id="translationBtn">
        <span class="dot"></span>
        <span id="translationLabel">Show translations · وەرگێڕان</span>
      </button>
    </div>
  </div>

  <div class="main">
    <div class="frame">
      <div class="num-row">
        <span class="line"></span>
        <span class="num" id="numLabel">١ / ١٣</span>
        <span class="line"></span>
      </div>
      <h1 class="virtue-name" id="virtueName"></h1>
      <p class="virtue-motto" id="virtueMotto"></p>

      <div class="translations hidden-state" id="translationsPanel">
        <div class="tr-block">
          <span class="tr-lang">English</span>
          <span class="tr-en" id="enName"></span>
          <span class="tr-en-motto" id="enMotto"></span>
        </div>
        <div class="tr-block">
          <span class="tr-lang">Kurdish · سۆرانی</span>
          <span class="tr-ku" id="kuName" dir="rtl"></span>
          <span class="tr-ku-motto" id="kuMotto" dir="rtl"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <button class="nav-btn" id="prevBtn" aria-label="السابق">›</button>
    <div class="progress-wrap" id="ticks"></div>
    <button class="nav-btn" id="nextBtn" aria-label="التالي">‹</button>
  </div>
</div>

<script>
const virtues = [
  { name:"الاعْتِدَال", motto:"لا تُفْرِطْ فِي الأَكْلِ حَتَّى الثِّقَل، وَلَا فِي الشُّرْبِ حَتَّى النَّشْوَة",
    en:{ name:"Temperance", motto:"Eat and drink in moderation, never to dullness or excess." },
    ku:{ name:"خۆگرتن", motto:"لە خواردن و خواردنەوەدا مامناوەند بە، هەرگیز تا سەرخۆشی یان زۆرەڕوویی مەڕۆ." } },

  { name:"الصَّمْت", motto:"لَا تَتَكَلَّمْ إِلَّا بِمَا يَنْفَعُ غَيْرَك أَوْ نَفْسَك، وَتَجَنَّبِ الكَلَامَ التَّافِه",
    en:{ name:"Silence", motto:"Speak only what benefits others or yourself; avoid trivial talk." },
    ku:{ name:"بێدەنگی", motto:"تەنها ئەوە بڵێ کە سوود بە خەڵک یان خۆت دەگەیەنێت، دووربکەوە لە قسەی بێ سوود." } },

  { name:"النِّظَام", motto:"اجْعَلْ لِكُلِّ شَيْءٍ مَكَانَه، وَلِكُلِّ عَمَلٍ وَقْتَه",
    en:{ name:"Order", motto:"Give every thing a place, and every task its own time." },
    ku:{ name:"ڕێکوپێکی", motto:"بۆ هەموو شتێک شوێنێک دابنێ، و بۆ هەموو کارێک کاتێک دیاری بکە." } },

  { name:"العَزْم", motto:"اعْزِمْ عَلَى فِعْلِ مَا يَنْبَغِي، وَنَفِّذْ بِلَا تَرَدُّدٍ مَا عَزَمْتَ عَلَيْه",
    en:{ name:"Resolution", motto:"Resolve to do what you should, and carry it out without fail." },
    ku:{ name:"چەسپاندنی بڕیار", motto:"بڕیار بدە بۆ ئەنجامدانی ئەوەی پێویستە، و بێ دوودڵی بیخە جێبەجێ." } },

  { name:"الاقْتِصَاد", motto:"لَا تُنْفِقْ إِلَّا فِيمَا يَنْفَعُك أَوْ يَنْفَعُ غَيْرَك، وَتَجَنَّبِ التَّبْذِير",
    en:{ name:"Frugality", motto:"Spend only on what benefits you or others; avoid waste." },
    ku:{ name:"قەناعەت", motto:"تەنها لەسەر ئەوەی سوودت پێدەگەیەنێت یان سوود بە خەڵک دەگەیەنێت خەرج بکە." } },

  { name:"الِاجْتِهَاد", motto:"لَا تُضَيِّعْ وَقْتًا، وَاشْغَلْ نَفْسَك دَوْمًا بِمَا هُوَ مُفِيد",
    en:{ name:"Industry", motto:"Lose no time; always be engaged in something useful." },
    ku:{ name:"کۆشش", motto:"کات بەفیڕۆ مەدە، هەمیشە خۆت بە شتێکی بەسوود سەرقاڵ بکە." } },

  { name:"الصِّدْق", motto:"لَا تَخْدَعْ بِإِلْحَاقِ الأَذَى، وَفَكِّرْ بِإِنْصَاف، وَتَكَلَّمْ كَمَا تُفَكِّر",
    en:{ name:"Sincerity", motto:"Use no hurtful deceit; think fairly, and speak as you think." },
    ku:{ name:"ڕاستگۆیی", motto:"فێڵ و خراپەکاری مەکە، بە دادپەروەرییەوە بیر بکەرەوە، و وەک بیرکردنەوەت قسە بکە." } },

  { name:"العَدْل", motto:"لَا تَظْلِمْ أَحَدًا بِإِلْحَاقِ ضَرَرٍ بِه، وَلَا بِمَنْعِ الخَيْرِ الوَاجِبِ عَلَيْك",
    en:{ name:"Justice", motto:"Wrong no one by harm, nor by withholding the good that is your duty." },
    ku:{ name:"دادپەروەری", motto:"ستەم لە کەس مەکە بە زیانپێگەیاندن، یان بە دەستڕاگرتن لە چاکەیەک کە ئەرکتە." } },

  { name:"الِاعْتِدَال فِي كُلِّ شَيْء", motto:"تَجَنَّبِ التَّطَرُّف، وَاحْتَمِلِ الإِسَاءَةَ بِقَدْرِ مَا تَسْتَحِقُّ لَا أَكْثَر",
    en:{ name:"Moderation", motto:"Avoid extremes; bear injuries only as much as you think they deserve." },
    ku:{ name:"میانەڕەوی", motto:"دووربکەوە لە توندڕەوی، ئازار تەنها بەو ڕادەیەی کە شایستەیە هەڵبگرە، زیاتر نا." } },

  { name:"النَّظَافَة", motto:"لَا تَحْتَمِلْ وَسَخًا فِي جَسَدِك أَوْ ثِيَابِك أَوْ مَسْكَنِك",
    en:{ name:"Cleanliness", motto:"Tolerate no uncleanliness in body, clothes, or dwelling." },
    ku:{ name:"پاکیزەیی", motto:"ڕێگا مەدە بە پیسی لە لەشت، جلوبەرگت، یان نیشتەجێبوونەکەت." } },

  { name:"الطُّمَأْنِينَة", motto:"لَا تَنْزَعِجْ مِنْ تَوَافِهِ الأُمُورِ أَوْ مِنْ حَوَادِثَ لَا مَفَرَّ مِنْهَا",
    en:{ name:"Tranquility", motto:"Be not disturbed by trifles, or by accidents common or unavoidable." },
    ku:{ name:"ئارامی", motto:"بەهۆی شتی بچووکەوە یان ڕووداوی ئاسایی و ناچاری مەشلەژێ." } },

  { name:"العِفَّة", motto:"اسْتَخْدِمِ الشَّهْوَةَ نَادِرًا، وَفَقَط مِنْ أَجْلِ الصِّحَّةِ أَوِ النَّسْل",
    en:{ name:"Chastity", motto:"Indulge rarely, and only for health or offspring." },
    ku:{ name:"پاکدامنی", motto:"کەم جار و تەنها لەبەر تەندروستی یان وەچە خۆت ڕابگرە." } },

  { name:"التَّوَاضُع", motto:"تَوَاضَعْ، وَاقْتَدِ بِالحُكَمَاءِ وَالصَّالِحِين",
    en:{ name:"Humility", motto:"Be humble, and follow the example of the wise and virtuous." },
    ku:{ name:"بێفیزی", motto:"بێفیز بە، و شوێنی نموونەی دانا و چاکەکاران بکەوە." } }
];

const arabicIndicNumerals = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicNumeral(n){
  return String(n).split('').map(d => arabicIndicNumerals[parseInt(d)]).join('');
}

// Strips Arabic diacritics (tashkeel/harakat): fatha, damma, kasra, tanwin,
// shadda, sukun, superscript alef, quranic annotation marks, etc.
function stripTashkeel(text){
  return text.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u08D3-\u08E1\u08E3-\u08FF]/g, '');
}

let current = 0;
let tashkeelOn = true;
let translationsOn = false;

const virtueNameEl = document.getElementById('virtueName');
const virtueMottoEl = document.getElementById('virtueMotto');
const numLabelEl = document.getElementById('numLabel');
const ticksWrap = document.getElementById('ticks');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const tashkeelBtn = document.getElementById('tashkeelBtn');
const tashkeelLabel = document.getElementById('tashkeelLabel');
const translationBtn = document.getElementById('translationBtn');
const translationLabel = document.getElementById('translationLabel');
const translationsPanel = document.getElementById('translationsPanel');
const enNameEl = document.getElementById('enName');
const enMottoEl = document.getElementById('enMotto');
const kuNameEl = document.getElementById('kuName');
const kuMottoEl = document.getElementById('kuMotto');

function buildTicks(){
  ticksWrap.innerHTML = '';
  virtues.forEach((_, i) => {
    const t = document.createElement('div');
    t.className = 'tick' + (i === current ? ' active' : '');
    t.addEventListener('click', () => { current = i; render(); });
    ticksWrap.appendChild(t);
  });
}

function render(){
  const v = virtues[current];
  const name = tashkeelOn ? v.name : stripTashkeel(v.name);
  const motto = tashkeelOn ? v.motto : stripTashkeel(v.motto);

  virtueNameEl.style.opacity = 0;
  virtueMottoEl.style.opacity = 0;
  setTimeout(() => {
    virtueNameEl.textContent = name;
    virtueMottoEl.textContent = motto;
    virtueNameEl.style.opacity = 1;
    virtueMottoEl.style.opacity = 1;
  }, 120);

  enNameEl.textContent = v.en.name;
  enMottoEl.textContent = v.en.motto;
  kuNameEl.textContent = v.ku.name;
  kuMottoEl.textContent = v.ku.motto;

  numLabelEl.textContent = toArabicNumeral(current + 1) + ' / ' + toArabicNumeral(virtues.length);
  prevBtn.disabled = current === virtues.length - 1 ? false : false;
  prevBtn.disabled = current >= virtues.length - 1;
  nextBtn.disabled = current <= 0;

  [...ticksWrap.children].forEach((t, i) => {
    t.classList.toggle('active', i === current);
  });
}

prevBtn.addEventListener('click', () => {
  if (current < virtues.length - 1){ current++; render(); }
});
nextBtn.addEventListener('click', () => {
  if (current > 0){ current--; render(); }
});

tashkeelBtn.addEventListener('click', () => {
  tashkeelOn = !tashkeelOn;
  tashkeelBtn.classList.toggle('off', !tashkeelOn);
  tashkeelLabel.textContent = tashkeelOn ? 'إخفاء التَّشكيل' : 'إظهار التَّشكيل';
  render();
});

translationBtn.addEventListener('click', () => {
  translationsOn = !translationsOn;
  translationBtn.classList.toggle('off', !translationsOn);
  translationLabel.textContent = translationsOn
    ? 'Hide translations · وەرگێڕان'
    : 'Show translations · وەرگێڕان';
  translationsPanel.classList.toggle('open', translationsOn);
  translationsPanel.classList.toggle('hidden-state', !translationsOn);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && current > 0){ current--; render(); }
  if (e.key === 'ArrowRight' && current < virtues.length - 1){ current++; render(); }
});

buildTicks();
render();
</script>

</body>
</html>
